<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퍼스널 컬러로 만나는 나의 성향 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#2A1B3D;
    --bg:#241730;
    --bg2:#341f45;
    --card:#FFFDF9;
    --coral:#FF6F59;
    --mint:#2FBE85;
    --lemon:#FFC93F;
    --lavender:#9C7CFF;
    --sky:#3FA7D6;
    --muted:#8b7fa0;
    --line:#ECE4F5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans KR',sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,111,89,0.25), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(156,124,255,0.28), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(47,190,133,0.22), transparent 45%),
      linear-gradient(160deg, var(--bg), var(--bg2));
    min-height:100vh;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }
  .app{
    width:100%;
    max-width:480px;
  }
  .brand{
    text-align:center;
    color:#F4EEFF;
    margin-bottom:18px;
  }
  .brand .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:#C9B8FF;
    text-transform:uppercase;
  }
  .brand h1{
    font-family:'Jua',sans-serif;
    font-size:32px;
    margin:4px 0 0;
  }
  .progress{
    display:flex;
    gap:6px;
    justify-content:center;
    margin-bottom:16px;
  }
  .progress span{
    width:26px;
    height:6px;
    border-radius:99px;
    background:rgba(255,255,255,0.18);
    transition:.3s;
  }
  .progress span.done{background:var(--lemon);}
  .progress span.now{background:var(--coral);width:38px;}

  .card{
    background:var(--card);
    border-radius:26px;
    padding:28px 24px 24px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
    position:relative;
    overflow:hidden;
  }
  .card.intro-card{
    background:
      radial-gradient(circle at 18% 15%, rgba(255,111,89,0.16), transparent 48%),
      radial-gradient(circle at 88% 12%, rgba(156,124,255,0.18), transparent 46%),
      radial-gradient(circle at 15% 85%, rgba(63,167,214,0.14), transparent 46%),
      radial-gradient(circle at 85% 88%, rgba(47,190,133,0.15), transparent 46%),
      var(--card);
  }
  .card::before{
    content:"";
    position:absolute;
    top:-40%;left:-20%;
    width:60%;height:180%;
    background:linear-gradient(120deg, var(--coral), var(--lemon), var(--mint), var(--lavender));
    opacity:.08;
    transform:rotate(12deg);
    pointer-events:none;
  }
  .step-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }
  h2.qtitle{
    font-family:'Jua',sans-serif;
    font-size:24px;
    line-height:1.4;
    margin:0 0 6px;
  }
  p.qhint{
    color:var(--muted);
    font-size:13.5px;
    line-height:1.6;
    margin:0 0 18px;
  }
  .scenario{
    background:#F7F2FF;
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    font-size:14.5px;
    line-height:1.65;
    margin-bottom:14px;
  }
  textarea, input[type=text]{
    width:100%;
    font-family:'Noto Sans KR',sans-serif;
    font-size:14.5px;
    padding:12px 14px;
    border-radius:12px;
    border:1.5px solid var(--line);
    resize:vertical;
    outline:none;
    background:#fff;
  }
  textarea:focus, input[type=text]:focus{border-color:var(--lavender);}
  textarea{min-height:88px;}
  .chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .chip{
    padding:9px 14px;
    border-radius:99px;
    border:1.5px solid var(--line);
    font-size:13.5px;
    cursor:pointer;
    background:#fff;
    user-select:none;
    transition:.15s;
  }
  .chip.sel{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:500;
  }
  .photo-drop{
    border:2px dashed var(--line);
    border-radius:16px;
    padding:22px;
    text-align:center;
    cursor:pointer;
    margin-bottom:14px;
    color:var(--muted);
    font-size:13.5px;
  }
  .photo-drop img{max-width:100%;max-height:220px;border-radius:12px;margin-top:10px;}
  .camera-wrap{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    background:#F2ECFB;
    border-radius:18px;
    overflow:hidden;
    margin-bottom:14px;
    border:1.5px solid var(--line);
  }
  .camera-preview{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .camera-msg{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;
    font-size:13px;line-height:1.6;color:var(--muted);
    background:#F2ECFB;
  }
  #captureBtn:disabled{background:#d9d2e6;cursor:not-allowed;}
  .swatch-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .avatar-box{
    display:flex;justify-content:center;margin:8px 0 16px;
  }
  .avatar-preview{
    width:150px;height:180px;
    border-radius:20px;
    overflow:hidden;
    border:1.5px solid var(--line);
    box-shadow:0 10px 24px -14px rgba(42,27,61,0.3);
    background:#F7F2FF;
  }
  .character-img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .character-placeholder{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:13px;color:var(--muted);line-height:1.5;
    padding:12px;
  }
  .swatch-chip{
    display:flex;align-items:center;gap:7px;
    padding:6px 14px 6px 6px;
  }
  .swatch-chip .dot{
    width:22px;height:22px;border-radius:50%;
    border:1px solid rgba(0,0,0,0.15);flex:none;
  }
  .swatch-chip.none .dot{
    background:repeating-linear-gradient(45deg,#e2dced,#e2dced 3px,#fff 3px,#fff 6px);
  }
  .photo-tap{
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .skip-link{
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
    text-decoration:underline;
    cursor:pointer;
    margin-bottom:6px;
  }
  .nav{display:flex;gap:10px;margin-top:20px;}
  button.btn{
    flex:1;
    border:none;
    padding:14px 18px;
    border-radius:14px;
    font-family:'Noto Sans KR',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    transition:.15s;
  }
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.primary:disabled{background:#d9d2e6;color:#fff;cursor:not-allowed;}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn.ghost-light{
    background:rgba(255,255,255,0.12);
    color:#F4EEFF;
    border:1.5px solid rgba(255,255,255,0.35);
  }
  .btn.ghost-light:hover{background:rgba(255,255,255,0.2);}
  .btn.wide{width:100%;}
  .intro-hero{
    font-family:'Jua',sans-serif;
    font-size:32px;
    line-height:1.4;
    margin:18px 0 16px;
    color:var(--ink);
  }
  .title-box{
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border-radius:22px;
    padding:20px 26px;
    box-shadow:0 14px 34px -16px rgba(42,27,61,0.25);
    border:1px solid rgba(255,255,255,0.6);
  }
  .intro-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:18px 0 22px;
  }
  .intro-list .row{
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:13.5px;
    line-height:1.55;
  }
  .intro-list .dot{
    flex:none;
    width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;color:#fff;font-weight:700;
  }
  .loading{
    text-align:center;
    padding:40px 10px;
  }
  .spinner{
    width:52px;height:52px;
    margin:0 auto 18px;
    border-radius:50%;
    background:conic-gradient(var(--coral),var(--lemon),var(--mint),var(--lavender),var(--coral));
    animation:spin 1.1s linear infinite;
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 8px), #000 0);
    mask:radial-gradient(farthest-side, transparent calc(100% - 8px), #000 0);
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading p{color:var(--muted);font-size:13.5px;}

  /* result card */
  .result-wrap{position:relative;padding:6px;border-radius:30px;
    background:conic-gradient(from var(--ang,0deg), var(--coral), var(--lemon), var(--mint), var(--lavender), var(--coral));
    animation:rot 6s linear infinite;
  }
  @keyframes rot{ from{--ang:0deg;} to{--ang:360deg;} }
  @property --ang { syntax:'<angle>'; inherits:false; initial-value:0deg; }
  .result-card{
    background:var(--card);
    border-radius:26px;
    padding:26px 22px;
  }
  .palette-strip{
    height:12px;
    border-radius:99px;
    margin:-2px 0 16px;
  }
  .portrait-frame{
    width:120px;height:144px;
    margin:0 auto 14px;
    border-radius:22px;
    overflow:hidden;
    border:4px solid var(--lavender);
    box-shadow:0 14px 30px -14px rgba(42,27,61,0.4);
    background:#F7F2FF;
  }
  .portrait-frame .portrait-img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .portrait-frame.avatar-frame svg{display:block;}
  .r-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  }
  .r-season{
    font-family:'Jua',sans-serif;
    font-size:28px;
    margin:4px 0 2px;
  }
  .r-score{
    display:inline-block;
    background:var(--ink);color:#fff;
    font-size:12px;font-weight:700;
    padding:4px 10px;border-radius:99px;
    margin-bottom:12px;
  }
  .r-reason{font-size:13.5px;line-height:1.65;color:#453958;margin-bottom:16px;}
  .r-section-title{
    display:inline-block;
    font-family:'Jua',sans-serif;
    font-size:15px;
    line-height:1.4;
    padding:6px 15px;
    border-radius:10px;
    margin:20px 0 10px;
  }
  .swrow{display:flex;flex-wrap:wrap;gap:10px;}
  .sw{text-align:center;width:52px;}
  .sw .dot{width:38px;height:38px;border-radius:50%;border:1px solid rgba(0,0,0,0.08);margin:0 auto 4px;}
  .sw .icon-badge{
    width:44px;height:44px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 4px;
    overflow:hidden;
  }
  .sw .icon-badge.photo-badge{
    background:#F7F2FF;border:1px solid var(--line);
  }
  .outfit-thumb{width:100%;height:100%;object-fit:cover;display:block;}
  .sw span{font-size:10.5px;color:var(--muted);}
  .kw-row{display:flex;flex-wrap:wrap;gap:6px;}
  .kw{
    background:#F7F2FF;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:500;color:var(--ink);
  }
  .style-cards{display:flex;flex-direction:column;gap:8px;}
  .style-card{
    background:#F7F2FF;border-radius:12px;padding:10px 12px;
    display:flex;flex-direction:column;gap:2px;
  }
  .style-card b{font-size:13.5px;color:var(--ink);}
  .style-card span{font-size:12.5px;line-height:1.5;color:#5c4f6e;}
  .rank-row{display:flex;gap:10px;}
  .rank-card{
    flex:1;
    background:#F7F2FF;border-radius:14px;padding:12px 10px;
    text-align:center;display:flex;flex-direction:column;gap:3px;align-items:center;
  }
  .rank-badge{font-size:26px;line-height:1;}
  .rank-metal{font-size:13.5px;font-weight:700;color:var(--ink);}
  .rank-desc{font-size:11.5px;line-height:1.5;color:#5c4f6e;}
  .concept-tag{
    display:inline-block;
    font-family:'Jua',sans-serif;
    font-size:14px;
    background:linear-gradient(120deg, var(--coral), var(--lavender));
    color:#fff;
    padding:6px 14px;
    border-radius:99px;
    margin-bottom:10px;
  }
  .r-p{font-size:13.5px;line-height:1.7;color:#453958;}
  ul.r-list{margin:4px 0 0;padding-left:18px;}
  ul.r-list li{font-size:13.5px;line-height:1.7;color:#453958;margin-bottom:2px;}
  .mbti-type-badge{
    font-family:'Jua',sans-serif;
    font-size:30px;
    letter-spacing:.06em;
    text-align:center;
    color:#fff;
    background:linear-gradient(120deg, var(--coral), var(--lavender));
    border-radius:16px;
    padding:12px 10px;
    margin-bottom:12px;
  }
  .mbti-axes{display:flex;flex-direction:column;gap:8px;}
  .mbti-axis-row{
    display:flex;align-items:flex-start;gap:10px;
    background:#F7F2FF;border-radius:12px;padding:10px 12px;
  }
  .mbti-axis-tag{
    flex:none;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;font-weight:700;
    color:var(--ink);
    background:#fff;
    border-radius:8px;
    padding:4px 8px;
    margin-top:1px;
  }
  .mbti-axis-body{display:flex;flex-direction:column;gap:2px;}
  .mbti-axis-body b{font-size:13.5px;color:var(--ink);}
  .mbti-axis-body span{font-size:12.5px;line-height:1.55;color:#5c4f6e;}
  .healbox{
    display:flex;align-items:center;gap:10px;
    background:#F7F2FF;border-radius:14px;padding:12px 14px;margin-top:6px;
  }
  .healbox .dot{width:30px;height:30px;border-radius:50%;flex:none;}
  .quote{
    margin-top:18px;
    font-family:'Jua',sans-serif;
    font-size:17px;
    line-height:1.5;
    text-align:center;
    padding:14px;
    border-top:1px dashed var(--line);
    border-bottom:1px dashed var(--line);
  }
  .r-footer{
    text-align:center;margin-top:14px;font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;
  }
  .error-box{
    background:#FFF1EE;border:1px solid #FFC9BE;border-radius:14px;
    padding:14px;font-size:13px;color:#B3402A;margin-bottom:14px;line-height:1.6;
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const state = {
  step: 0,
  photoBase64: null,
  photoMediaType: null,
  skinTone: '', vein: '', jewelry: '',
  eyeColor: '', hairColor: '',
  gender: '', hairStyle: 'bob',
  q_ei: '', q_sn: '', q_ft: '', q_jp: '', q_stress: '',
  favColors: '', friendKeyword: '',
  result: null,
  error: null
};

const steps = ['intro','photo','colorinfo','q_ei','q_sn','q_ft','q_jp','q_stress','extra','loading','result'];
const app = document.getElementById('app');

function go(delta){
  state.step = Math.min(steps.length-1, Math.max(0, state.step+delta));
  render();
}
function jump(name){ state.step = steps.indexOf(name); render(); }

function progressDots(){
  // only meaningful for the question flow (steps 1..8)
  const total = 8, current = state.step; // 1..8
  let html = '<div class="progress">';
  for(let i=1;i<=total;i++){
    let cls = i < current ? 'done' : (i===current ? 'now' : '');
    html += `<span class="${cls}"></span>`;
  }
  html += '</div>';
  return html;
}

function render(){
  stopCamera();
  const s = steps[state.step];
  let inner = '';
  if(s === 'intro'){
    inner += `<div class="brand"><div class="eyebrow">HUE &amp; ME</div></div>`;
  } else if(s !== 'result'){
    inner += `<div class="brand"><div class="eyebrow">HUE &amp; ME</div></div>`;
  }
  if(state.step>=1 && state.step<=8) inner += progressDots();

  if(s==='intro') inner += renderIntro();
  else if(s==='photo') inner += renderPhoto();
  else if(s==='colorinfo') inner += renderColorInfo();
  else if(s==='q_ei') inner += renderScenario('E · I | 에너지 사용과 회복', '오전 내내 여러 사람과 함께 일한 뒤 한 시간의 점심시간이 생겼습니다. 누구와 어디에서 어떻게 보내고 싶나요?', 'q_ei');
  else if(s==='q_sn') inner += renderScenario('S · N | 정보 인식하는 특성', '인상 깊게 본 책이나 영화에 대해 친구에게 소개한다면 전체 의미 또는 구체적 내용, 어떻게 이야기 해줄 건가요?', 'q_sn');
  else if(s==='q_ft') inner += renderScenario('F · T | 판단과 선택의 기준', '친한 사람이 시험에서 떨어져 속상하다고 합니다. 가장 먼저 어떤 말을 하고, 이후 무엇을 해주고 싶은가요?', 'q_ft');
  else if(s==='q_jp') inner += renderScenario('J · P | 생활 업무 계획 실행', '아무 약속도 없는 주말, 미리 일정을 정해두고 싶은가요, 당일 기분에 따라 보내고 싶은가요? 어떻게 보내나요?', 'q_jp');
  else if(s==='q_stress') inner += renderScenario('나를 알아가는 질문', '요즘 스트레스를 받으면 주로 무엇을 하며 푸나요? 아무거나 편하게 적어주세요.', 'q_stress');
  else if(s==='extra') inner += renderExtra();
  else if(s==='loading') inner += renderLoading();
  else if(s==='result') inner += renderResult();

  const cardStyle = s==='result' ? 'display:none' : (s==='intro' ? 'min-height:560px;display:flex;flex-direction:column;' : '');
  const cardClass = s==='intro' ? 'card intro-card' : 'card';
  app.innerHTML = `<div class="${cardClass}" style="${cardStyle}">${s==='result'?'':inner}</div>` ;
  if(s==='result'){
    app.innerHTML = inner;
  }
  attachHandlers();
  if(s==='photo' && !state.photoBase64) initCamera();
  saveDraft();
}

const DRAFT_KEY = 'color_signature_draft';

function saveDraft(){
  try{
    if(!window.storage) return;
    const snapshot = JSON.stringify(state);
    window.storage.set(DRAFT_KEY, snapshot, false).catch(()=>{});
  }catch(e){ /* not logged in yet, or storage unavailable — ignore */ }
}

async function loadDraft(){
  try{
    if(window.storage){
      const res = await window.storage.get(DRAFT_KEY, false);
      if(res && res.value){
        const saved = JSON.parse(res.value);
        Object.assign(state, saved);
      }
    }
  }catch(e){ /* no saved draft — start fresh */ }
  render();
  if(steps[state.step] === 'loading'){
    // was interrupted (e.g. by a login redirect) right as analysis started — resume automatically
    callClaude();
  }
}

function clearDraft(){
  try{
    if(window.storage) window.storage.delete(DRAFT_KEY, false).catch(()=>{});
  }catch(e){}
}

function renderIntro(){
  return `
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;">
    <div class="title-box" style="margin-top:-70px;">
      <div class="intro-hero" style="text-align:center;margin:0;">퍼스널 컬러로<br>만나는 나의 성향 카드</div>
    </div>
    <p class="qhint" style="text-align:center;margin-top:26px;">사진 한 장과 몇 가지 질문으로<br>나만의 색과 성향을 담은 카드를 완성해요.</p>
  </div>
  <div class="nav" style="margin-top:0;"><button class="btn primary wide" onclick="go(1)">시작하기</button></div>`;
}

function renderPhoto(){
  if(state.photoBase64){
    return `
    <div class="step-label">STEP 1 / 8</div>

let cameraStream = null;
let cameraMode = null; // 'live' | 'file'

function initCamera(){
  const video = document.getElementById('cameraVideo');
  const fallback = document.getElementById('cameraFallback');
  const loading = document.getElementById('cameraLoading');
  if(!video) return;
  cameraMode = null;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    cameraMode = 'file';
    if(loading) loading.style.display = 'none';
    if(fallback) fallback.style.display = 'flex';
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false})
    .then(stream=>{
      cameraStream = stream;
      video.srcObject = stream;
      video.style.display = 'block';
      if(loading) loading.style.display = 'none';
      cameraMode = 'live';
    })
    .catch(()=>{
      cameraMode = 'file';
      if(loading) loading.style.display = 'none';
      if(fallback) fallback.style.display = 'flex';
    });
}
function stopCamera(){
  if(cameraStream){
    cameraStream.getTracks().forEach(t=>t.stop());
    cameraStream = null;
  }
}
function handleCaptureClick(){
  if(cameraMode === 'live'){
    capturePhotoFromVideo();
  } else {
    document.getElementById('photoCapture').click();
  }
}
function capturePhotoFromVideo(){
  const video = document.getElementById('cameraVideo');
  const canvas = document.getElementById('captureCanvas');
  if(!video || !video.videoWidth) return;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  state.photoMediaType = 'image/jpeg';
  state.photoBase64 = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];
  stopCamera();
  render();
}
function retakePhoto(){
  state.photoBase64 = null;
  state.photoMediaType = null;
  render();
}
function skipPhoto(){
  state.photoBase64 = null; state.photoMediaType = null;
  stopCamera();
  go(1);
}

function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  return [ (num>>16)&255, (num>>8)&255, num&255 ];
}
function colorDist(hexA, hexB){
  try{
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    return Math.sqrt((a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2);
  }catch(e){ return 999; }
}
function findClosestOutfitItem(category, hex, gender){
  const genderKey = (gender === '남자') ? '남자' : '여자';
  const genderCatalog = OUTFIT_CATALOG[genderKey] || OUTFIT_CATALOG['여자'];
  const list = genderCatalog[category];
  if(!list || !list.length || !hex) return null;
  let best = list[0], bestDist = colorDist(hex, list[0].hex);
  for(const item of list){
    const d = colorDist(hex, item.hex);
    if(d < bestDist){ best = item; bestDist = d; }
  }
  return best;
}

function styleKeywordChip(k){
  const icon = STYLE_KEYWORD_ICONS[k];
  return `<span class="kw">${icon ? icon+' ' : ''}${k}</span>`;
}

function swatchRow(name, options, current){
  let html = options.map(o =>
    `<div class="chip swatch-chip ${current===o.label?'sel':''}" data-field="${name}" data-val="${o.label}">
      <span class="dot" style="background:${o.hex}"></span>${o.label}
    </div>`).join('');
  html += `<div class="chip swatch-chip none ${current==='모르겠어요'?'sel':''}" data-field="${name}" data-val="모르겠어요">
      <span class="dot"></span>모르겠어요
    </div>`;
  return html;
}

function characterImgHtml(gender){
  const src = CHARACTER_IMAGES[gender];
  if(!src){
    return `<div class="character-placeholder">성별을 선택하면<br>캐릭터가 나타나요</div>`;
  }
  return `<img src="${src}" class="character-img" alt="캐릭터">`;
}

function renderScenario(title, scenarioText, field){
  return `
  <div class="step-label">STEP ${state.step} / 8</div>

  <div class="scenario">${scenarioText}</div>
  <textarea id="ans" placeholder="편하게 떠오르는 대로 적어보세요...">${state[field]}</textarea>
  <div class="nav">
    <button class="btn ghost" onclick="go(-1)">이전</button>
    <button class="btn primary" id="nextBtn" onclick="saveScenario('${field}')">다음</button>

}
function saveScenario(field){
  const val = document.getElementById('ans').value.trim();
  if(!val){ document.getElementById('ans').style.borderColor = 'var(--coral)'; return; }
  state[field] = val;
  go(1);
}

  const swatch = c => `<div class="sw"><div class="dot" style="background:${c.hex}"></div><span>${c.name}</span></div>`;

    <div class="kw-row">${(r.keywords||[]).map(k=>`<span class="kw">${k}</span>`).join('')}</div>

    ${sTitle('살짝 아쉬운 색')}

    ${sTitle('힐링 컬러')}

    <div class="quote">"${r.message || ''}"</div>

  <div class="nav" style="margin-top:18px;">

function resetAll(){
  Object.assign(state, {
    step:0, photoBase64:null, photoMediaType:null,
    skinTone:'', vein:'', jewelry:'', eyeColor:'', hairColor:'',
    gender:'', hairStyle:'bob',
    q_ei:'', q_sn:'', q_ft:'', q_jp:'', q_stress:'',
    favColors:'', friendKeyword:'', result:null, error:null
  });
  clearDraft();
  render();
}

function downloadCard(){
  const el = document.getElementById('resultCard');
  html2canvas(el, {backgroundColor:'#FFFDF9', scale:2}).then(canvas=>{
    const link = document.createElement('a');
    link.download = '컬러_시그니처.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

function attachHandlers(){
  const photoInput = document.getElementById('photoCapture');
  if(photoInput){
    photoInput.addEventListener('change', e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        state.photoMediaType = file.type;
        state.photoBase64 = dataUrl.split(',')[1];
        render();
      };
      reader.readAsDataURL(file);
    });
  }
  document.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const field = chip.dataset.field, val = chip.dataset.val;
      state[field] = val;
      render();
    });
  });
}

  if(state.favColors) lines.push(`- 평소 끌리는 색: ${state.favColors}`);
  lines.push('');
  lines.push('[성향 질문 답변]');

  lines.push(`- (F·T) 속상한 친구에게 하는 말/행동: ${state.q_ft}`);
  lines.push(`- (J·P) 약속 없는 주말을 보내는 방식: ${state.q_jp}`);
  lines.push(`- 스트레스를 풀 때 하는 것: ${state.q_stress}`);

const SYSTEM_PROMPT = `당신은 초·중·고 학생들을 위한 친절한 퍼스널컬러 & 성향 분석가입니다.
학생이 알려준 정보(사진 및/또는 피부·눈동자·머리카락 설명, 성향 질문 답변)를 바탕으로 아래 JSON 스키마에 맞춰 **오직 JSON만** 응답하세요. 코드블록(백틱), 설명, 다른 텍스트를 절대 포함하지 마세요.

규칙:
- 화장품, 염색약 등 외모 관리 제품은 추천하지 않습니다. hair_recommend는 염색을 권하는 게 아니라 "이런 헤어컬러가 이 톤과 잘 어울려요"라는 정보 제공 목적입니다.
- 외모를 평가하거나 비교하는 표현을 쓰지 않고, 항상 긍정적이고 응원하는 톤을 유지합니다.
- '아쉬운 색'은 부드럽게, 비난하지 않는 톤으로 씁니다.
- [성향 질문 답변]에 있는 E·I, S·N, F·T, J·P 4개 질문에 대한 답변을 각각 분석해서, 각 축마다 어느 쪽에 가까운지 mbti_axes에 반드시 채워주세요. 이건 공식 심리 진단이 아니라 "이 답변에서 느껴지는 경향"이라는 가벼운 톤으로, 재미있는 자기이해 활동처럼 표현합니다. 100% 단정("당신은 무조건 E형입니다")이 아니라 "~한 경향이 보여요" 같은 부드러운 표현을 씁니다.
- outfit_items는 실제 상품이 아니라 "이런 색 계열의 옷/아이템이 잘 어울려요"라는 색상 조합 제안입니다.
- 모든 문장은 짧고 쉬운 한국어로 씁니다.
- 전체 응답은 2500 토큰 이내로 작성하되, 무엇보다 **완전한 JSON으로 끝까지 마무리하는 것이 최우선**입니다. 분량이 걱정되면 문장을 더 짧게 줄이세요 — 절대로 문자열이나 배열, 객체가 중간에 잘린 채로 끝나면 안 됩니다.
- 각 문장은 최대한 짧게(15단어 이내) 씁니다. desc, reason, personality_summary 등 설명 필드는 특히 간결하게 씁니다.
- hex 색상 코드는 실제 그 색에 맞는 정확한 값을 사용합니다.
- [색 정보]에 "모름"이라고 적힌 항목이 있다면: 사진이 첨부되어 있으면 사진을 최우선으로 판단 근거로 삼습니다. 사진이 없다면, "모름"이 아닌 다른 답변들(눈동자색, 혈관색, 실버/골드 선호 등)로 최대한 합리적으로 추론하되, match_score를 그만큼 보수적으로 낮추고(예: 90%가 아니라 55~65% 등), reason에 "정보가 부족해서 일부는 추정했어요" 같은 뉘앙스를 짧게 넣어 정직하게 알려줍니다. 근거 없이 확신에 찬 표현("정확히 이 톤이에요")은 쓰지 않습니다.
- 사진이 첨부되어 있고, 텍스트로 답한 피부/눈동자/머리카락 색 정보가 사진에서 실제로 보이는 것과 다르다면: **사진에서 눈으로 보이는 색을 항상 우선**으로 삼아 분석합니다 (사진은 조명 등의 영향을 받을 수 있다는 점을 감안하되, 텍스트 답변보다 신뢰도 높은 근거로 취급합니다). 학생이 "틀렸다"고 지적하거나 답변을 콕 집어 정정하는 표현은 쓰지 않고, 자연스럽게 사진 기준으로 분석 결과를 제시합니다. 사진으로 판단하기 어려운 항목(혈관 색, 실버/골드 선호 등 사진만으로 알 수 없는 것)은 계속 텍스트 답변을 그대로 사용합니다.
- 화장품(립컬러, 아이섀도우 등) 추천은 절대 하지 않습니다. 학생 대상 앱이므로 색/스타일 정보에만 집중합니다.
- accessory_rank는 실버/골드 2가지를 이 톤에 더 잘 어울리는 순서대로 순위(1,2)를 매겨 채웁니다. 학생이 "실버"/"골드"/"둘 다"/"모르겠어요" 중 하나를 답했다면 그 답변을 존중하되, 퍼스널컬러 이론상 더 어울리는 쪽을 근거와 함께 설명합니다.
- hairstyle_recommend는 실제 인물 사진이 아니라 스타일 이름과 짧은 설명만 제공합니다 (예: "롱 스트레이트 - 차분하고 세련된 느낌을 줘요").

JSON 스키마:
{
  "season": "예: 봄 웜톤 (라이트 스프링)",
  "match_score": 0-100 사이 정수,
  "reason": "2~3문장 설명",

function repairTruncatedJSON(raw){
  // Attempt to recover a usable object from a JSON string that was cut off mid-way.
  // Strategy: trim back to the last complete ",\"key\":" boundary or last closing bracket,
  // then close any open strings/arrays/objects.
  let s = raw;
  // If it ends mid-string (odd number of unescaped quotes after last structural char), cut back to last comma at depth-safe point.
  for(let attempt=0; attempt<30; attempt++){
    try{
      let candidate = s;
      // balance: count braces/brackets outside of strings
      let inStr=false, esc=false, depthObj=0, depthArr=0;
      for(let i=0;i<candidate.length;i++){
        const c = candidate[i];
        if(inStr){
          if(esc){ esc=false; }
          else if(c==='\\'){ esc=true; }
          else if(c==='"'){ inStr=false; }
        } else {
          if(c==='"') inStr=true;
          else if(c==='{') depthObj++;
          else if(c==='}') depthObj--;
          else if(c==='[') depthArr++;
          else if(c===']') depthArr--;
        }
      }
      if(inStr) candidate += '"';
      candidate += ']'.repeat(Math.max(0,depthArr)) + '}'.repeat(Math.max(0,depthObj));
      return JSON.parse(candidate);
    }catch(e){
      // trim back to previous comma at top level and retry
      const lastComma = s.lastIndexOf(',');
      if(lastComma < 0) return null;
      s = s.slice(0, lastComma);
    }
  }
  return null;
}
